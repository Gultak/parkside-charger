# Parkside X20V 10-slot shelf charger - ESPHome configuration
# Controller: ESP32-C6-DevKitC-1 (or Seeed XIAO ESP32C6: same I2C pins 22/23)

substitutions:
  name: parkside-charger
  friendly_name: Parkside Charger

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.12.0

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [parkside_charger, parkside_slot]

logger:
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

# ---------------------------------------------------------------- I2C ----
i2c:
  - id: i2c_main
    sda: GPIO22
    scl: GPIO23
    frequency: 100kHz # long-ish cables to the slots: keep it slow
    scan: true

# Each slot board has the same addresses (LTC4162 0x68 fixed), so every
# slot gets its own mux channel. Mux A: slots 1-8, mux B: slots 9-10.
tca9548a:
  - id: mux_a
    i2c_id: i2c_main
    address: 0x70
    channels:
      - { bus_id: slot1_bus, channel: 0 }
      - { bus_id: slot2_bus, channel: 1 }
      - { bus_id: slot3_bus, channel: 2 }
      - { bus_id: slot4_bus, channel: 3 }
      - { bus_id: slot5_bus, channel: 4 }
      - { bus_id: slot6_bus, channel: 5 }
      - { bus_id: slot7_bus, channel: 6 }
      - { bus_id: slot8_bus, channel: 7 }
  - id: mux_b
    i2c_id: i2c_main
    address: 0x71
    channels:
      - { bus_id: slot9_bus, channel: 0 }
      - { bus_id: slot10_bus, channel: 1 }

# ---------------------------------------------------- main board I/O ----
output:
  - platform: gpio
    id: bus_switch # P-MOSFET switch for the 24 V bus to all slot boards (default off)
    pin: GPIO21
  - platform: gpio
    id: buzzer_out
    pin: GPIO20

sensor:
  - platform: sht4x
    i2c_id: i2c_main
    address: 0x44
    temperature:
      id: enclosure_temp
      name: "Enclosure temperature"
    humidity:
      name: "Enclosure humidity"
    update_interval: 30s
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 120s

number:
  - platform: template
    id: storage_days
    name: "Auto mode: storage after (days)"
    icon: mdi:calendar-clock
    unit_of_measurement: d
    min_value: 0 # 0 = never drop to storage
    max_value: 45
    step: 1
    initial_value: 14
    optimistic: true
    restore_value: true
    entity_category: config

switch:
  - platform: template
    id: charging_enabled
    name: "Charging enabled"
    icon: mdi:power-plug-battery
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(charger).set_enabled(true);
    turn_off_action:
      - lambda: id(charger).set_enabled(false);

button:
  - platform: template
    name: "Charge all to 100%"
    icon: mdi:battery-arrow-up-outline
    on_press:
      - lambda: id(charger).request_full_all();
  - platform: restart
    name: "Restart"

parkside_charger:
  id: charger
  # Mean Well LRS-200-24: 200 W -> ~8.5 A battery-side at 21 V incl. losses
  max_total_current: 8A
  enable_output: bus_switch
  ambient_temperature: enclosure_temp
  max_ambient_temperature: 45
  storage_after_days_number: storage_days
  total_input_power:
    name: "Total charging power"
  charging_count:
    name: "Batteries charging"
  present_count:
    name: "Batteries present"
  status:
    name: "Charger status"

# Audible alarm on any slot fault or overheating (optional)
interval:
  - interval: 10s
    then:
      - lambda: |-
          bool alarm = id(enclosure_temp).has_state() && id(enclosure_temp).state > 50;
          for (auto *s : {id(slot1), id(slot2), id(slot3), id(slot4), id(slot5),
                          id(slot6), id(slot7), id(slot8), id(slot9), id(slot10)})
            alarm |= s->phase() == esphome::parkside_charger::Phase::FAULT;
          id(buzzer_out).set_state(alarm);

# ------------------------------------------------------------- slots ----
packages:
  slot1: !include { file: slot.yaml, vars: { n: 1 } }
  slot2: !include { file: slot.yaml, vars: { n: 2 } }
  slot3: !include { file: slot.yaml, vars: { n: 3 } }
  slot4: !include { file: slot.yaml, vars: { n: 4 } }
  slot5: !include { file: slot.yaml, vars: { n: 5 } }
  slot6: !include { file: slot.yaml, vars: { n: 6 } }
  slot7: !include { file: slot.yaml, vars: { n: 7 } }
  slot8: !include { file: slot.yaml, vars: { n: 8 } }
  slot9: !include { file: slot.yaml, vars: { n: 9 } }
  slot10: !include { file: slot.yaml, vars: { n: 10 } }
