# Parkside X20V shelf charger (up to 16 slots) - ESPHome configuration
# Controller: xyzroe ESP32-C6 D1 (ESP32-C6-MINI-1-N4) on the controller board
# (electronics/controller-board). GPIO map (controller board):
#   GPIO22 SDA, GPIO23 SCL, GPIO19 24 V bus switch, GPIO18 buzzer,
#   GPIO4 TCA9548A reset (active low), GPIO0 PSU voltage /11, GPIO1 bus voltage /11,
#   GPIO6 PSU fan PWM (open drain via 2N7002, so inverted), GPIO7 PSU fan tach
# Fewer slots? Delete the unused "slotN" packages at the end.

substitutions:
  name: parkside-charger
  friendly_name: Parkside Charger
  # Home Assistant entity with the temperature of the room / cupboard the charger is in
  room_temperature_entity: sensor.hotpress_temperature_sensor_temperature
  # charging budget (battery side) without / with the PSU fan running. LOP-300-24: 180 W by
  # convection, 300 W with forced air; the fan blows onto the board from above, not the
  # datasheet's direction, so stay well below 300 W. (LOP-400-24: 10.0 / 13.0)
  budget_no_fan: "7.0"
  budget_with_fan: "10.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.12.0

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB # ESP32-C6-MINI-1-N4
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [parkside_charger, parkside_slot]

logger:
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

# ---------------------------------------------------------------- I2C ----
i2c:
  - id: i2c_main
    sda: GPIO22
    scl: GPIO23
    frequency: 100kHz # long-ish cables to the slots: keep it slow
    scan: true

# Each slot board has the same addresses (LTC4162 0x68 fixed), so every
# slot gets its own mux channel. Mux A (0x70): slots 1-8, mux B (0x71): slots 9-16.
tca9548a:
  # channel -> slot mapping follows the controller board layout (see
  # electronics/controller-board/tools/design.py CHANNEL_SLOT)
  - id: mux_a
    i2c_id: i2c_main
    address: 0x70
    channels:
      - { bus_id: slot1_bus, channel: 0 }
      - { bus_id: slot2_bus, channel: 1 }
      - { bus_id: slot3_bus, channel: 2 }
      - { bus_id: slot4_bus, channel: 3 }
      - { bus_id: slot5_bus, channel: 4 }
      - { bus_id: slot6_bus, channel: 5 }
      - { bus_id: slot7_bus, channel: 6 }
      - { bus_id: slot8_bus, channel: 7 }
  - id: mux_b
    i2c_id: i2c_main
    address: 0x71
    channels:
      - { bus_id: slot9_bus, channel: 7 }
      - { bus_id: slot10_bus, channel: 6 }
      - { bus_id: slot11_bus, channel: 5 }
      - { bus_id: slot12_bus, channel: 4 }
      - { bus_id: slot13_bus, channel: 3 }
      - { bus_id: slot14_bus, channel: 2 }
      - { bus_id: slot15_bus, channel: 1 }
      - { bus_id: slot16_bus, channel: 0 }

# ---------------------------------------------------- main board I/O ----
output:
  - platform: gpio
    id: bus_switch # P-MOSFET switch for the 24 V bus to all slot boards (default off)
    pin: GPIO19
  - platform: ledc
    id: fan_pwm
    pin:
      number: GPIO6
      inverted: true # the 2N7002 pulls the fan's PWM line low
    frequency: 25000Hz
    min_power: 0.2 # most PC fans stop below ~20 %
    zero_means_zero: true
  - platform: gpio
    id: buzzer_out
    pin: GPIO18
  - platform: gpio
    id: mux_reset # TCA9548A RESET, active low
    pin:
      number: GPIO4
      inverted: true

sensor:
  # PSU fan tach: 2 pulses per revolution
  - platform: pulse_counter
    id: fan_rpm
    name: "PSU fan speed"
    pin: GPIO7 # 10k pull-up on the board
    unit_of_measurement: rpm
    icon: mdi:fan
    accuracy_decimals: 0
    update_interval: 5s
    filters:
      - multiply: 0.5
  - platform: htu21d     # SHT21 breakout (fixed address 0x40)
    model: SHT21
    i2c_id: i2c_main
    temperature:
      id: enclosure_temp
      name: "Enclosure temperature"
    humidity:
      name: "Enclosure humidity"
    update_interval: 30s
  # room temperature from Home Assistant (safety interlock B)
  - platform: homeassistant
    id: room_temp
    entity_id: ${room_temperature_entity}
    internal: true
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 120s
  - platform: adc
    pin: GPIO0
    id: psu_voltage
    name: "PSU voltage"
    attenuation: 12db
    filters:
      - multiply: 11.0 # 100k / 10k divider
    accuracy_decimals: 1
    update_interval: 10s
  - platform: adc
    pin: GPIO1
    id: bus_voltage
    name: "Slot bus voltage"
    attenuation: 12db
    filters:
      - multiply: 11.0
    accuracy_decimals: 1
    update_interval: 10s

number:
  # ---- safety interlock limits (see "Safety interlock" below)
  - platform: template
    id: max_enclosure_temp
    name: "Safety: max enclosure temperature"
    icon: mdi:thermometer-alert
    unit_of_measurement: °C
    min_value: 30
    max_value: 50
    step: 1
    initial_value: 45
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: max_room_temp
    name: "Safety: max room temperature"
    icon: mdi:home-thermometer
    unit_of_measurement: °C
    min_value: 25
    max_value: 45
    step: 1
    initial_value: 36
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: ha_grace
    name: "Safety: Home Assistant grace period"
    icon: mdi:timer-sand
    unit_of_measurement: s
    min_value: 30
    max_value: 900
    step: 30
    initial_value: 120
    optimistic: true
    restore_value: true
    entity_category: config
  - platform: template
    id: storage_days
    name: "Auto mode: storage after (days)"
    icon: mdi:calendar-clock
    unit_of_measurement: d
    min_value: 0 # 0 = never drop to storage
    max_value: 45
    step: 1
    initial_value: 14
    optimistic: true
    restore_value: true
    entity_category: config

fan:
  - platform: speed
    id: psu_fan
    name: "PSU fan"
    output: fan_pwm
    restore_mode: ALWAYS_OFF

switch:
  - platform: template
    id: allow_without_ha
    name: "Safety: allow charging without Home Assistant"
    icon: mdi:home-off-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF # keep off: only for HA maintenance, and you then
    entity_category: config           # lose the room temperature check as well
  - platform: template
    id: charging_enabled
    name: "Charging enabled"
    icon: mdi:power-plug-battery
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(charger).set_enabled(true);
    turn_off_action:
      - lambda: id(charger).set_enabled(false);

button:
  - platform: template
    name: "Charge all to 100%"
    icon: mdi:battery-arrow-up-outline
    on_press:
      - lambda: id(charger).request_full_all();
  - platform: restart
    name: "Restart"
  - platform: template
    name: "Reset I2C multiplexers"
    entity_category: diagnostic
    on_press:
      - output.turn_on: mux_reset
      - delay: 5ms
      - output.turn_off: mux_reset

parkside_charger:
  id: charger
  # Battery-side current budget shared by all slots. Size it to the PSU:
  #   LOP-300-24 (180 W): 7A, 10A with the fan    LOP-400-24 (250 W): 10A, 13A with the fan
  #   external LRS-200-24 (200 W): 8A    LRS-350-24 / HLG-320H-24 (320-350 W): 14A
  max_total_current: 7A # changed at run time: ${budget_no_fan} A / ${budget_with_fan} A with the fan
  enable_output: bus_switch
  ambient_temperature: enclosure_temp
  max_ambient_temperature: 50 # hard backstop; the adjustable limit is the safety interlock below
  storage_after_days_number: storage_days
  total_input_power:
    id: total_power
    name: "Total charging power"
  charging_count:
    name: "Batteries charging"
  present_count:
    name: "Batteries present"
  status:
    name: "Charger status"

binary_sensor:
  - platform: template
    id: fan_fault_bs
    name: "PSU fan fault"
    device_class: problem
  - platform: template
    id: safety_interlock
    name: "Safety interlock"
    device_class: problem

text_sensor:
  - platform: template
    id: safety_reason
    name: "Safety interlock reason"
    icon: mdi:shield-alert-outline

# Safety interlock: the 24 V bus is switched off and no slot charges while
#   A) the enclosure (SHT21) is above "max enclosure temperature" (3 degC hysteresis),
#      or the SHT21 has not delivered a value for the grace period,
#   B) the room (${room_temperature_entity}) is above "max room temperature" (2 degC
#      hysteresis), or that value has been unknown / unavailable for the grace period,
#   C) Home Assistant has not been connected for the grace period (unless "allow charging
#      without Home Assistant" is on). After a boot, charging waits for Home Assistant.
# It overrides the "Charging enabled" switch and releases by itself once all is well again.
interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t grace = (uint32_t) id(ha_grace).state * 1000;
          // when each input went missing (0 = fine, UINT32_MAX = not seen since boot: fail at once)
          static uint32_t api_lost = UINT32_MAX, room_lost = UINT32_MAX, enc_lost = UINT32_MAX;
          static bool enc_hot = false, room_hot = false;
          auto since = [&](bool ok, uint32_t &t) {
            if (ok) t = 0; else if (t == 0) t = now ? now : 1;
            return !ok && (t == UINT32_MAX || now - t >= grace);
          };
          std::vector<std::string> why;

          // A) enclosure temperature (SHT21 on the controller board)
          float te = id(enclosure_temp).state;
          bool enc_ok = id(enclosure_temp).has_state() && !std::isnan(te);
          if (since(enc_ok, enc_lost)) why.push_back("enclosure sensor not responding");
          if (enc_ok) {
            if (te > id(max_enclosure_temp).state) enc_hot = true;
            else if (te < id(max_enclosure_temp).state - 3) enc_hot = false;
          }
          if (enc_hot) why.push_back(str_sprintf("enclosure %.1f °C too hot", te));

          // C) Home Assistant connection
          bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (since(api_ok, api_lost) && !id(allow_without_ha).state)
            why.push_back("Home Assistant not connected");

          // B) room temperature from Home Assistant (NaN when HA reports it unavailable)
          float tr = id(room_temp).state;
          bool room_ok = id(room_temp).has_state() && !std::isnan(tr);
          if (since(room_ok, room_lost) && !(id(allow_without_ha).state && !api_ok))
            why.push_back("room temperature unknown");
          if (room_ok) {
            if (tr > id(max_room_temp).state) room_hot = true;
            else if (tr < id(max_room_temp).state - 2) room_hot = false;
          }
          if (room_hot) why.push_back(str_sprintf("room %.1f °C too hot", tr));

          std::string reason;
          for (auto &w : why) reason += (reason.empty() ? "" : ", ") + w;
          id(charger).set_interlock(!why.empty(), reason);
          id(safety_interlock).publish_state(!why.empty());
          if (id(safety_reason).state != (why.empty() ? "OK" : reason))
            id(safety_reason).publish_state(why.empty() ? "OK" : reason);

  # Audible alarm on any slot fault or overheating (optional)
  # PSU fan: off below 100 W charging power and 35 degC in the box, then 30-100 % with
  # power (100-300 W) or enclosure temperature (35-45 degC), whichever asks for more.
  # The higher budget is only allowed while the tach confirms the fan turns; a stalled
  # fan drops it back to the convection budget at once (and the buzzer sounds).
  - interval: 5s
    then:
      - lambda: |-
          float p = id(total_power).has_state() ? id(total_power).state : 0;
          float t = id(enclosure_temp).has_state() && !std::isnan(id(enclosure_temp).state) ? id(enclosure_temp).state : 50;
          float want = std::max((p - 100.0f) / 200.0f, (t - 35.0f) / 10.0f);
          static bool on = false;
          if (want > 0.0f) on = true; else if (p < 80.0f && t < 33.0f) on = false;
          float duty = on ? std::min(1.0f, std::max(0.3f, want)) : 0.0f;
          if (duty > 0) {
            auto call = id(psu_fan).turn_on();
            call.set_speed((int) roundf(duty * 100));
            call.perform();
          } else {
            id(psu_fan).turn_off().perform();
          }
          // fan check: turning for 15 s -> higher budget; not turning for 10 s while on -> fault
          static uint32_t spin_since = 0, stall_since = 0;
          const uint32_t now = millis();
          bool turning = id(fan_rpm).has_state() && id(fan_rpm).state > 300;
          if (on && !turning) { if (!stall_since) stall_since = now; } else stall_since = 0;
          if (on && turning) { if (!spin_since) spin_since = now; } else spin_since = 0;
          bool fan_fault = stall_since && now - stall_since > 10000;
          bool boost = on && spin_since && now - spin_since > 15000 && !fan_fault;
          id(charger).set_max_total_current(boost ? ${budget_with_fan} : ${budget_no_fan});
          if (id(fan_fault_bs).state != fan_fault || !id(fan_fault_bs).has_state())
            id(fan_fault_bs).publish_state(fan_fault);
  - interval: 10s
    then:
      - lambda: |-
          bool alarm = (id(enclosure_temp).has_state() && id(enclosure_temp).state > 50) || id(fan_fault_bs).state;
          for (auto *s : id(charger)->slots())
            alarm |= s->phase() == esphome::parkside_charger::Phase::FAULT;
          id(buzzer_out).set_state(alarm);

# ------------------------------------------------------------- slots ----
packages:
  slot1: !include { file: slot.yaml, vars: { n: 1 } }
  slot2: !include { file: slot.yaml, vars: { n: 2 } }
  slot3: !include { file: slot.yaml, vars: { n: 3 } }
  slot4: !include { file: slot.yaml, vars: { n: 4 } }
  slot5: !include { file: slot.yaml, vars: { n: 5 } }
  slot6: !include { file: slot.yaml, vars: { n: 6 } }
  slot7: !include { file: slot.yaml, vars: { n: 7 } }
  slot8: !include { file: slot.yaml, vars: { n: 8 } }
  slot9: !include { file: slot.yaml, vars: { n: 9 } }
  slot10: !include { file: slot.yaml, vars: { n: 10 } }
  slot11: !include { file: slot.yaml, vars: { n: 11 } }
  slot12: !include { file: slot.yaml, vars: { n: 12 } }
  slot13: !include { file: slot.yaml, vars: { n: 13 } }
  slot14: !include { file: slot.yaml, vars: { n: 14 } }
  slot15: !include { file: slot.yaml, vars: { n: 15 } }
  slot16: !include { file: slot.yaml, vars: { n: 16 } }
